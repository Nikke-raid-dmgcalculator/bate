<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凸ダメージ計算＆重複チェックツール</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f0f2f5; color: #333; }
h1 { font-size: 1.5rem; margin-bottom: 10px; }
.container { max-width: 900px; margin: 0 auto; }
.total-box { background: #007bff; color: #fff; padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; text-align: center; }
.deck-card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; }
.deck-card.error { border: 2px solid #ff4d4f; background: #fff1f0; }
.form-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
label { font-weight: bold; width: 80px; }
input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; }
.error-msg { color: #ff4d4f; font-weight: bold; font-size: 0.85rem; margin-top: 5px; display: none; }
.deck-card.error .error-msg { display: block; }
.checkbox-label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
<h1>凸ダメージ計算ツール</h1>

<div class="total-box">
有効合計ダメージ: <span id="totalDamage">0</span>
</div>

<div id="deckList"></div>
</div>

<script>
const attributes = ['灼熱', '水冷', '風圧', '鉄鋼', '電撃'];
const decks = [];

function init() {
const container = document.getElementById('deckList');
let html = '';

attributes.forEach(attr => {
for (let i = 1; i <= 3; i++) {
const id = `${attr}_${i}`;
decks.push(id);

html += `
<div class="deck-card" id="card_${id}">
<div class="form-group">
<label>${attr} ${i}凸</label>
<input type="text" id="chara_${id}" placeholder="編成キャラ（例: ラピ、クラウン）" oninput="calculate()">
<input type="number" id="dmg_${id}" placeholder="ダメージ" oninput="calculate()">
<label class="checkbox-label">
<input type="checkbox" id="used_${id}" onchange="calculate()"> 使用済
</label>
</div>
<div class="error-msg">⚠️ 他の【使用済】編成とキャラが重複しているため、計算から除外されています</div>
</div>
`;
}
});

container.innerHTML = html;
}

function calculate() {
const usedCharas = new Set();

decks.forEach(id => {
const isUsed = document.getElementById(`used_${id}`).checked;
const charaInput = document.getElementById(`chara_${id}`).value.trim();

if (isUsed && charaInput !== "") {
const charaArray = charaInput.split(/[、,,\s]+/).filter(c => c !== "");
charaArray.forEach(c => usedCharas.add(c));
}
});

let totalDamage = 0;

decks.forEach(id => {
const isUsed = document.getElementById(`used_${id}`).checked;
const charaInput = document.getElementById(`chara_${id}`).value.trim();
const dmgInput = parseFloat(document.getElementById(`dmg_${id}`).value) || 0;
const cardEl = document.getElementById(`card_${id}`);

let isDuplicate = false;

if (!isUsed && charaInput !== "") {
const charaArray = charaInput.split(/[、,,\s]+/).filter(c => c !== "");
isDuplicate = charaArray.some(c => usedCharas.has(c));
}

if (isDuplicate) {
cardEl.classList.add('error');
} else {
cardEl.classList.remove('error');
totalDamage += dmgInput;
}
});

document.getElementById('totalDamage').textContent = totalDamage.toLocaleString();
}

window.onload = init;
</script>

</body>
</html>
